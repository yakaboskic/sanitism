</g></g><g data-cell-id="gitd"><g transform="translate(0.5,0.5)"><rect x="356" y="68" width="270" height="44" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#4f5a6d" font-family="Georgia" font-size="14px" style="fill: light-dark(rgb(79, 90, 109), rgb(152, 161, 178));"><text x="358" y="88">on GitHub. The project gets a repo:</text><text x="358" y="105">history, branches, pull requests</text></g></g></g><g data-cell-id="cli"><g transform="translate(0.5,0.5)"><rect x="356" y="246" width="230" height="44" rx="6.16" ry="6.16" fill="#172033" stroke="none" pointer-events="all" style="fill: light-dark(rgb(23, 32, 51), rgb(204, 211, 228));"/></g><g><g fill="#ffffff" font-family="Menlo, Consolas, monospace" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"><text x="471" y="274.5">uvx … init my-paper</text></g></g></g><g data-cell-id="clid"><g transform="translate(0.5,0.5)"><rect x="356" y="298" width="270" height="44" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#4f5a6d" font-family="Georgia" font-size="14px" style="fill: light-dark(rgb(79, 90, 109), rgb(152, 161, 178));"><text x="358" y="318">in a terminal. A plain folder, no git;</text><text x="358" y="335">add --git when you want history</text></g></g></g><g data-cell-id="proj"><g><rect x="696" y="72" width="276" height="200" rx="12" ry="12" fill="#ffffff" stroke="#172033" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(23, 32, 51), rgb(204, 211, 228));"/></g><g><g fill="#172033" font-family="Georgia" font-weight="bold" font-size="18px" style="fill: light-dark(rgb(23, 32, 51), rgb(204, 211, 228));"><text x="712" y="106">the same project</text></g></g></g><g data-cell-id="projtree"><g transform="translate(0.5,0.5)"><rect x="710" y="108" width="160" height="130" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172033" font-family